<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Controlador de Contador TCG</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; max-width: 500px; margin: 0 auto; }
    .card { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    label { display: block; margin-top: 10px; font-size: 0.9em; color: #ccc; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: none; box-sizing: border-box; }
    input[type="color"] { height: 40px; padding: 0; cursor: pointer; }
    button { background: #007bff; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button.danger { background: #dc3545; }
    button.success { background: #28a745; }
    .flex { display: flex; gap: 10px; }
  </style>
</head>
<body>

<h2>Controlador de Contador</h2>

<div class="card">
  <h3>Tiempo</h3>
  <label>Minutos iniciales para la ronda:</label>
  <input type="number" id="minutesInput" value="50" min="1">
  <div class="flex">
    <button class="success" onclick="startTimer()">Iniciar / Reanudar</button>
    <button onclick="pauseTimer()">Pausar</button>
  </div>
  <button class="danger" onclick="resetTimer()">Reiniciar con nuevo tiempo</button>
</div>

<div class="card">
  <h3>Personalización Visual</h3>
  <label>Fuente:</label>
  <select id="fontSelect" onchange="updateStyle()">
    <option value="Arial, sans-serif">Arial</option>
    <option value="'Courier New', monospace">Courier New (Monoespaciada)</option>
    <option value="'Impact', sans-serif">Impact</option>
    <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
  </select>

  <label>Tamaño de fuente (px):</label>
  <input type="number" id="fontSizeInput" value="80" onchange="updateStyle()">

  <label>Color del Texto:</label>
  <input type="color" id="textColorInput" value="#FFFFFF" onchange="updateStyle()">

  <label>Color en Tiempo Extra (Negativo):</label>
  <input type="color" id="overtimeColorInput" value="#FF3333" onchange="updateStyle()">
</div>

<!-- SDK de Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Reemplaza con tus credenciales de Firebase Console
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_PROYECTO.firebaseapp.com",
    databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com",
    projectId: "TU_PROYECTO",
    storageBucket: "TU_PROYECTO.appspot.com",
    messagingSenderId: "NUMERO",
    appId: "TU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const timerRef = ref(db, 'timer');

  window.startTimer = async () => {
    const snapshot = await get(timerRef);
    const data = snapshot.val() || {};
    let target = data.targetTimestamp;

    // Si estaba pausado o no iniciado, re-calcula el target según el tiempo restante
    if (!data.isRunning) {
      const remaining = data.remainingMs ?? (parseInt(document.getElementById('minutesInput').value) * 60 * 1000);
      target = Date.now() + remaining;
    }

    update(timerRef, {
      isRunning: true,
      targetTimestamp: target
    });
  };

  window.pauseTimer = async () => {
    const snapshot = await get(timerRef);
    const data = snapshot.val();
    if (data && data.isRunning) {
      const remaining = data.targetTimestamp - Date.now();
      update(timerRef, {
        isRunning: false,
        remainingMs: remaining
      });
    }
  };

  window.resetTimer = () => {
    const mins = parseInt(document.getElementById('minutesInput').value) || 50;
    const durationMs = mins * 60 * 1000;
    set(timerRef, {
      isRunning: false,
      remainingMs: durationMs,
      targetTimestamp: Date.now() + durationMs,
      font: document.getElementById('fontSelect').value,
      fontSize: document.getElementById('fontSizeInput').value + 'px',
      color: document.getElementById('textColorInput').value,
      overtimeColor: document.getElementById('overtimeColorInput').value
    });
  };

  window.updateStyle = () => {
    update(timerRef, {
      font: document.getElementById('fontSelect').value,
      fontSize: document.getElementById('fontSizeInput').value + 'px',
      color: document.getElementById('textColorInput').value,
      overtimeColor: document.getElementById('overtimeColorInput').value
    });
  };
</script>
</body>
</html>
